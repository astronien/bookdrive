name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ตรวจ type ก่อน build — เร็วกว่ามากและเป็นด่านที่พังบ่อยที่สุด
      - run: npm run typecheck
      - run: npm run build
